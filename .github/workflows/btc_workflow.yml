name: BTC Agent
on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run BTC Agent
        env:
          TELEGRAM_TOKEN_BTC: ${{ secrets.TELEGRAM_TOKEN_BTC }}
          TELEGRAM_CHAT_ID_BTC: ${{ secrets.TELEGRAM_CHAT_ID_BTC }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # 🟢 ฝั่ง BTC ก็พ่วงกลุ่มมาใช้ร่วมกันตรงนี้เลย
          TELEGRAM_GROUP_CHAT_ID_001: ${{ secrets.TELEGRAM_GROUP_CHAT_ID_001 }}
          TELEGRAM_GROUP_CHAT_ID_002: ${{ secrets.TELEGRAM_GROUP_CHAT_ID_002 }}
          TELEGRAM_GROUP_CHAT_ID_003: ${{ secrets.TELEGRAM_GROUP_CHAT_ID_003 }}
        run: python btc_main.py
