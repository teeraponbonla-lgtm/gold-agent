name: BTC Agent
on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run BTC Agent
        env:
          # แก้ไขฝั่งซ้ายมือ (Environment Variable ของระบบ) ให้มี _BTC ต่อท้าย เพื่อให้ Python เรียกใช้งานได้ถูกต้อง
          TELEGRAM_TOKEN_BTC: ${{ secrets.TELEGRAM_TOKEN_BTC }}
          TELEGRAM_CHAT_ID_BTC: ${{ secrets.TELEGRAM_CHAT_ID_BTC }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python btc_main.py
